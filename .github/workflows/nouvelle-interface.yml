# Nettoyage PC 5 (nouvelle interface Avalonia, en construction) : compilation et captures à chaque envoi
# sur la branche interface-avalonia. Les résultats (journal de compilation, captures PNG) sont poussés sur
# la branche « captures-avalonia » pour être consultés sans télécharger d'artefact.
# Cette fabrication ne publie rien : la version 4 reste la version distribuée.
name: Nouvelle interface

on:
  push:
    branches: [ interface-avalonia ]
  workflow_dispatch:

# un seul envoi à la fois : un nouvel envoi annule la fabrication dépassée (les résultats sont remplacés)
concurrency:
  group: nouvelle-interface
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apercu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilation
        id: compilation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build nouvelle-interface/NettoyagePC.Nouveau.csproj -c Release -o sortie-avalonia 2>&1 | tee compilation.txt

      - name: Captures (rendu sans écran)
        id: captures
        if: steps.compilation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # phrases affichées en anglais / espagnol sans traduction dans traductions.tsv (liste de contrôle)
          export NP_TRADUCTIONS_MANQUANTES="$PWD/captures/traductions-manquantes.txt"
          dotnet sortie-avalonia/NettoyagePC.dll --captures captures 2>&1 | tee captures.txt

      - name: Résultats sur la branche captures-avalonia
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/envoi
          cp compilation.txt /tmp/envoi/ 2>/dev/null || true
          cp captures.txt /tmp/envoi/ 2>/dev/null || true
          cp -r captures /tmp/envoi/ 2>/dev/null || true
          printf 'commit %s\ncompilation %s\ncaptures %s\n' "$GITHUB_SHA" "${{ steps.compilation.outcome }}" "${{ steps.captures.outcome }}" > /tmp/envoi/etat.txt
          cd /tmp/envoi
          git init -q
          git checkout -q -b captures-avalonia
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures de $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" captures-avalonia

      - name: Échec si la compilation ou les captures ont échoué
        if: steps.compilation.outcome != 'success' || steps.captures.outcome != 'success'
        run: exit 1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Programme Windows en un seul fichier
        id: publication
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish nouvelle-interface/NettoyagePC.Nouveau.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publie 2>&1 | Tee-Object publication.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $f = Get-Item publie\NettoyagePC.exe
          "NettoyagePC.exe : {0:N1} Mo" -f ($f.Length / 1MB) | Tee-Object -Append taille.txt

      - name: Programme (artefact)
        if: steps.publication.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NettoyagePC-5-apercu
          path: publie/NettoyagePC.exe

      # Programme chiffré pour un essai sur le PC de l'éditeur : seul l'environnement de travail de Claude a la clé privée.
      # Le fichier poussé sur la branche « essai-v5-chiffre » est illisible sans elle : rien n'est publié en clair.
      - name: Programme chiffré (essai sur le PC de l'éditeur)
        if: steps.publication.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          mkdir -p chiffre
          cat > publique.pem <<'FIN'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwHjKQZ2wMTSSEbzg/Owb
          hES3M/+yeYNsCdJe5n/0je7399XNDieFwOvSZMURhadhspp2G9YtYgFYx5wLfdnj
          oGynmIVM7qCdCyM7pEOjKM7Xh7fHnqlWDmwxQG5P9iPKc6t8ZEtqQll9onEazDVB
          vImOIQ4dTpZaX4IaQy1bXxz54tRmNgGQrqSjuPmTWfShvu9NHQJSON9aXWHof1Wy
          T5gEBEMRoYbD85hDwaO0iLsn9btObQvDo/lvdv8PFKrL09MQM3mFBc5XU/rdUAFz
          ysW1dOSw6rFD5x0blX2EAKuzr9aQi6TjbFFXKWYitSkIngYFfJny/KttLhCBnUrX
          GokFf1A/vboI6WxO2a50FO3hu/Qpghuy+lWfuFa38Bgcb4GKsU45qstv+BYlOI4h
          9JwtIsNSMBPHdsq9fHxoRhYyte1gtNu7kmNEc5TK1J44HA3AH6KbCnkWDSwMTU1n
          Tz5FQcSLdqN51cn2KaIl1A2lvWBZvJSkV7w6OX6rsSPVAgMBAAE=
          -----END PUBLIC KEY-----
          FIN
          openssl rand -hex 32 > cle.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in publie/NettoyagePC.exe -out chiffre/NettoyagePC.exe.chiffre -pass file:cle.txt
          openssl pkeyutl -encrypt -pubin -inkey publique.pem -pkeyopt rsa_padding_mode:oaep -in cle.txt -out chiffre/cle.chiffree
          rm -f cle.txt
          sha256sum publie/NettoyagePC.exe | cut -d' ' -f1 > chiffre/empreinte.txt
          echo "$GITHUB_SHA" > chiffre/commit.txt
          cd chiffre
          git init -q
          git checkout -q -b essai-v5-chiffre
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Programme chiffré de $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" essai-v5-chiffre

      # Essais sur un vrai Windows, en lecture seule : le moteur de la version 4, compilé pour .NET 10, tourne-t-il ?
      # (état du PC en JSON, analyse complète en simulation, vrai bilan de l'accueil et captures avec ces données)
      - name: Essais sous Windows (lecture seule)
        id: essais
        if: steps.publication.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force essais-windows | Out-Null
          $exe = (Resolve-Path publie\NettoyagePC.exe).Path
          $global:echecs = 0
          function Lancer($nom, $arguments, $delai, $attendu = 0) {
            $chrono = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -RedirectStandardOutput "essais-windows\$nom.txt" -RedirectStandardError "essais-windows\$nom-erreurs.txt" -PassThru -NoNewWindow
            $null = $p.Handle
            if (-not $p.WaitForExit($delai * 1000)) { try { $p.Kill() } catch {} ; $code = 'délai dépassé' } else { $p.WaitForExit(); $code = $p.ExitCode }
            if ("$code" -ne "$attendu") { $global:echecs++ }
            "{0} : code {1} (attendu {2}), {3} ms" -f $nom, $code, $attendu, $chrono.ElapsedMilliseconds | Tee-Object -Append essais-windows\resume.txt
          }
          Lancer 'etat' '--etat' 180
          Lancer 'verifier-cle' '--verifier-cle NPC-abc.def' 60 1
          Lancer 'analyse' '--moteur --simulation --profond --disques --liberer-ram --optimiser --securite' 2400
          Lancer 'captures' '--captures essais-windows\captures --reel' 600
          # vraie fenêtre : temps d'ouverture et d'arrivée du bilan (la fenêtre se ferme toute seule)
          Lancer 'demarrage' '--essai-demarrage essais-windows\demarrage-temps.txt' 120
          Lancer 'demarrage2' '--essai-demarrage essais-windows\demarrage-temps-2.txt' 120
          Copy-Item essais-windows\captures\rapport.txt essais-windows\captures-rapport.txt -ErrorAction SilentlyContinue
          $journal = Join-Path $env:LOCALAPPDATA 'NettoyagePC\demarrage.log'
          if (Test-Path $journal) { Copy-Item $journal essais-windows\demarrage.log }
          if ($global:echecs -gt 0) { "$global:echecs essai(s) en échec" | Tee-Object -Append essais-windows\resume.txt; exit 1 }

      # Passage de la version 4 à la version 5 sur un Windows vierge : installation de la dernière version 4 publiée,
      # entretien automatique activé, puis installateur de la version 5 par-dessus (silencieux), contrôles, désinstallation.
      # Rien n'est publié : l'installateur est seulement gardé comme artefact.
      - name: Installateur de la version 5 et passage depuis la version 4
        id: installation
        if: steps.publication.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force essais-windows | Out-Null
          $log = 'essais-windows\installation.txt'
          function Noter($t) { $t | Tee-Object -Append $log }
          function Fermer() { Get-Process NettoyagePC -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }
          $mk = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress | Out-Null }
          Copy-Item publie\NettoyagePC.exe . -Force
          & $mk /V2 /DV5 "/DVERSION=5.2" "/DVERSION4=5.2.0.0" installateur.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué" }
          $setup5 = (Resolve-Path 'NettoyagePC-Setup-5.2.exe').Path
          Noter ("installateur 5.0 : {0:N1} Mo" -f ((Get-Item $setup5).Length / 1MB))
          $dossier = Join-Path $env:ProgramFiles 'Nettoyage PC'
          $exe = Join-Path $dossier 'NettoyagePC.exe'

          # 1. version 4 publiée
          # dernière version 4 publiée (pas « latest » : une publication sans fichier ou une version 5 peut l'être)
          $rel = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=30" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $a = $rel | Where-Object { -not $_.draft -and -not $_.prerelease } | ForEach-Object { $_.assets } | Where-Object { $_.name -match '^NettoyagePC-Setup-4[\d.]*\.exe$' } | Select-Object -First 1
          if (-not $a) { throw 'Aucun installateur de la version 4 publié' }
          Invoke-WebRequest $a.browser_download_url -OutFile setup4.exe
          $p = Start-Process .\setup4.exe -ArgumentList '/S' -Wait -PassThru
          Fermer
          Noter ("version 4 : installateur code {0}, programme {1}" -f $p.ExitCode, (Get-Item $exe).VersionInfo.ProductVersion)
          $p = Start-Process $exe -ArgumentList '--moteur --planifier' -Wait -PassThru -WindowStyle Hidden
          $tache = Get-ScheduledTask -TaskName 'Nettoyage PC*' -ErrorAction SilentlyContinue | Select-Object -First 1
          Noter ("entretien automatique (version 4) : code {0}, tâche {1}" -f $p.ExitCode, $(if ($tache) { $tache.TaskName } else { 'absente' }))

          # 2. version 5 par-dessus
          $chrono = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $setup5 -ArgumentList '/S' -Wait -PassThru
          Fermer
          $v = (Get-Item $exe).VersionInfo
          Noter ("version 5 : installateur code {0} en {1} s, programme {2} ({3:N1} Mo)" -f $p.ExitCode, [int]$chrono.Elapsed.TotalSeconds, $v.ProductVersion, ((Get-Item $exe).Length / 1MB))
          if ($p.ExitCode -ne 0) { throw "installation de la version 5 en échec" }
          if (-not $v.ProductVersion.StartsWith('5')) { throw "le programme installé n'est pas la version 5" }
          $prec = Join-Path $dossier 'precedente\NettoyagePC.exe'
          Noter ("version précédente gardée : {0}" -f $(if (Test-Path $prec) { (Get-Item $prec).VersionInfo.ProductVersion } else { 'non' }))
          foreach ($f in 'legal\LICENCE.txt', 'Desinstaller.exe', 'LISEZMOI.txt') { if (-not (Test-Path (Join-Path $dossier $f))) { throw "fichier absent après l'installation : $f" } }
          $cle = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NettoyagePC'
          Noter ("Applications installées : {0} {1}" -f $cle.DisplayName, $cle.DisplayVersion)
          $tache = Get-ScheduledTask -TaskName 'Nettoyage PC*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tache) { Noter ("entretien automatique (version 5) : {0} -> {1} {2}" -f $tache.TaskName, $tache.Actions[0].Execute, $tache.Actions[0].Arguments) } else { Noter 'entretien automatique (version 5) : tâche absente' }

          # 3. le programme installé fonctionne
          $p = Start-Process $exe -ArgumentList '--autocontrole' -Wait -PassThru
          Noter ("auto-contrôle : code {0}" -f $p.ExitCode)
          if ($p.ExitCode -ne 0) { throw "auto-contrôle en échec" }
          $p = Start-Process $exe -ArgumentList '--etat' -Wait -PassThru -RedirectStandardOutput essais-windows\etat-installe.txt
          Noter ("état du PC (programme installé) : code {0}" -f $p.ExitCode)
          $p = Start-Process $exe -ArgumentList '--gardien' -PassThru
          if (-not $p.WaitForExit(20000)) { $p | Stop-Process -Force; throw "le gardien ne s'est pas arrêté sans Premium" }
          Noter ("gardien sans Premium : s'arrête tout seul (code {0})" -f $p.ExitCode)
          $p = Start-Process $exe -ArgumentList '--essai-demarrage essais-windows\demarrage-installe.txt' -Wait -PassThru
          Noter ("fenêtre du programme installé : code {0} ; {1}" -f $p.ExitCode, ((Get-Content essais-windows\demarrage-installe.txt -ErrorAction SilentlyContinue) -join ' / '))

          # 4. désinstallation
          $p = Start-Process (Join-Path $dossier 'Desinstaller.exe') -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5
          $reste = Test-Path $exe
          $tache = Get-ScheduledTask -TaskName 'Nettoyage PC*' -ErrorAction SilentlyContinue
          Noter ("désinstallation : code {0}, programme {1}, tâches {2}" -f $p.ExitCode, $(if ($reste) { 'encore là' } else { 'retiré' }), $(if ($tache) { 'encore là' } else { 'retirées' }))
          if ($reste) { throw "le programme est resté après la désinstallation" }

      - name: Installateur de la version 5 (artefact)
        if: steps.installation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NettoyagePC-Setup-5.2-apercu
          path: NettoyagePC-Setup-5.2.exe

      - name: Résultats sur la branche captures-avalonia-windows
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/envoi
          cp publication.txt taille.txt /tmp/envoi/ 2>/dev/null || true
          cp -r essais-windows /tmp/envoi/ 2>/dev/null || true
          printf 'commit %s\npublication %s\nessais %s\ninstallation %s\n' "$GITHUB_SHA" "${{ steps.publication.outcome }}" "${{ steps.essais.outcome }}" "${{ steps.installation.outcome }}" > /tmp/envoi/etat.txt
          cd /tmp/envoi
          git init -q
          git checkout -q -b captures-avalonia-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" captures-avalonia-windows
