# Nettoyage PC 5 : fabrication et publication de la version 5.
# Se lance quand un tag « v5.x » est créé (jamais à un simple envoi de code sur main) :
# - tag « v5.0 » : version normale, proposée en mise à jour aux PC qui ont la version 4 ;
# - tag « v5.0-beta1 » (ou -beta2...) : pré-version, que la version 4 installée ne propose pas
#   (les mises à jour de la version 4 ignorent les pré-versions) et que le bouton « Télécharger » du site ne vise pas.
# - envoi sur la branche « fabrication-5 » : mêmes fabrication et essais, SANS publication (fichiers de la version
#   pour une publication à la main par l'éditeur, transmis chiffrés : seul l'environnement de travail de Claude a la clé) ;
# - si la publication a déjà été faite à la main sur GitHub, le tag ne republie rien (les essais tournent quand même).
# Une version qui échoue à un essai n'est jamais publiée.
name: Publication version 5

on:
  push:
    tags: [ 'v5.*' ]
    branches: [ fabrication-5 ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String src\Noyau\Base.cs -Pattern 'Version = "([\d.]+)";\s*// version 5').Matches[0].Groups[1].Value
          $beta = $false
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $m = [regex]::Match($env:GITHUB_REF_NAME, '^v(\d+(?:\.\d+){1,3})(-beta\d*)?$')
            if (-not $m.Success -or $m.Groups[1].Value -ne $v) { throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $v du programme (Base.cs)." }
            $beta = $m.Groups[2].Success
          }
          $p = $v.Split('.'); while ($p.Count -lt 4) { $p += '0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "version4=$($p -join '.')" >> $env:GITHUB_OUTPUT
          "beta=$($beta.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path "NOTES-$v.txt")) { throw "NOTES-$v.txt manquant (texte de la publication)." }
          Write-Host "Version $v (pré-version : $beta)"

      - name: Textes légaux
        shell: pwsh
        run: |
          foreach ($f in 'LICENCE', 'CONDITIONS-DE-VENTE', 'CONFIDENTIALITE', 'MENTIONS-LEGALES') { if (-not (Test-Path "legal\$f.txt")) { throw "legal\$f.txt manquant" } }
          $reste = Select-String -Path legal\*.txt -Pattern '\[(PRÉNOM|ADRESSE|E-MAIL|NUMÉRO|NOM DU MÉDIATEUR)' -Encoding utf8
          if ($reste) { Write-Warning ("Textes légaux : " + $reste.Count + " passage(s) entre crochets à compléter (voir GUIDE-EDITEUR.txt)") }

      - name: Programme Windows en un seul fichier
        shell: pwsh
        run: |
          dotnet publish nouvelle-interface/NettoyagePC.Nouveau.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:InformationalVersion=${{ steps.version.outputs.version }}" -p:IncludeSourceRevisionInInformationalVersion=false -o publie
          if ($LASTEXITCODE -ne 0) { throw "Compilation en échec" }
          "NettoyagePC.exe : {0:N1} Mo" -f ((Get-Item publie\NettoyagePC.exe).Length / 1MB)

      - name: Auto-contrôle (fenêtre et pages, deux thèmes, deux langues)
        shell: pwsh
        run: |
          $p = Start-Process publie\NettoyagePC.exe -ArgumentList '--autocontrole' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\NettoyagePC\demarrage.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "Auto-contrôle en échec (code $($p.ExitCode))" }

      - name: Moteur en simulation
        shell: pwsh
        run: |
          $p = Start-Process publie\NettoyagePC.exe -ArgumentList '--moteur', '--simulation', '--sans-rapport' -Wait -PassThru -RedirectStandardOutput moteur.txt
          Get-Content moteur.txt -Tail 25
          if ($p.ExitCode -ne 0) { throw "Moteur en échec (code $($p.ExitCode))" }

      - name: Installateur
        shell: pwsh
        run: |
          $mk = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress | Out-Null }
          Copy-Item publie\NettoyagePC.exe . -Force
          & $mk /V2 /DV5 "/DVERSION=${{ steps.version.outputs.version }}" "/DVERSION4=${{ steps.version.outputs.version4 }}" installateur.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué" }
          $f = "NettoyagePC-Setup-${{ steps.version.outputs.version }}.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToUpper()
          Set-Content "NettoyagePC-Setup-${{ steps.version.outputs.version }}.sha256" "$h  $f" -Encoding ascii
          Write-Host "SHA256 : $h"
          # copie au nom fixe (bouton « Télécharger » du site) : seulement pour une version normale
          if ('${{ steps.version.outputs.beta }}' -ne 'true') { Copy-Item $f NettoyagePC-Setup.exe }

      - name: Passage depuis la version 4 (installation silencieuse par-dessus la version publiée)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Noter($t) { Write-Host "::notice::$t" }
          function Fermer() { Get-Process NettoyagePC -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }
          try {
            $dossier = Join-Path $env:ProgramFiles 'Nettoyage PC'
            $exe = Join-Path $dossier 'NettoyagePC.exe'
            $setup5 = (Resolve-Path "NettoyagePC-Setup-${{ steps.version.outputs.version }}.exe").Path
            Invoke-WebRequest 'https://github.com/damiencoussot-ai/nettoyage-pc/releases/latest/download/NettoyagePC-Setup.exe' -OutFile setup4.exe
            $p = Start-Process (Resolve-Path .\setup4.exe).Path -ArgumentList '/S' -Wait -PassThru
            Fermer
            Noter ("Version publiée installée : {0} (code {1})" -f (Get-Item $exe).VersionInfo.ProductVersion, $p.ExitCode)
            $p = Start-Process $setup5 -ArgumentList '/S' -Wait -PassThru
            Fermer
            if ($p.ExitCode -ne 0) { throw "Installation silencieuse en échec (code $($p.ExitCode))" }
            $v = (Get-Item $exe).VersionInfo.ProductVersion
            Noter "Version installée : $v"
            if (-not $v.StartsWith('${{ steps.version.outputs.version }}')) { throw "Version installée inattendue : $v" }
            foreach ($f in 'legal\LICENCE.txt', 'Desinstaller.exe') { if (-not (Test-Path (Join-Path $dossier $f))) { throw "Fichier absent après l'installation : $f" } }
            $p = Start-Process $exe -ArgumentList '--autocontrole' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Auto-contrôle du programme installé en échec (code $($p.ExitCode))" }
            $g = Start-Process $exe -ArgumentList '--gardien' -PassThru
            if (-not $g.WaitForExit(20000)) { $g | Stop-Process -Force; throw "Le gardien ne s'est pas arrêté sans Premium" }
            $p = Start-Process (Join-Path $dossier 'Desinstaller.exe') -ArgumentList '/S' -Wait -PassThru
            Start-Sleep 5
            if (Test-Path $exe) { throw "Le programme est resté après la désinstallation" }
            Noter "Passage 4 -> $v : installation, auto-contrôle, gardien et désinstallation corrects."
          }
          catch { Write-Host "::error::Passage depuis la version 4 : $($_.Exception.Message)"; exit 1 }

      - name: Fichiers de la version
        uses: actions/upload-artifact@v4
        with:
          name: NettoyagePC-${{ steps.version.outputs.version }}
          path: |
            NettoyagePC-Setup-*.exe
            NettoyagePC-Setup-*.sha256

      # Fichiers pour une publication à la main (branche fabrication-5) : chiffrés, rien n'est publié en clair
      - name: Fichiers chiffrés pour l'éditeur
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -e
          v='${{ steps.version.outputs.version }}'
          mkdir -p chiffre
          cat > publique.pem <<'FIN'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwHjKQZ2wMTSSEbzg/Owb
          hES3M/+yeYNsCdJe5n/0je7399XNDieFwOvSZMURhadhspp2G9YtYgFYx5wLfdnj
          oGynmIVM7qCdCyM7pEOjKM7Xh7fHnqlWDmwxQG5P9iPKc6t8ZEtqQll9onEazDVB
          vImOIQ4dTpZaX4IaQy1bXxz54tRmNgGQrqSjuPmTWfShvu9NHQJSON9aXWHof1Wy
          T5gEBEMRoYbD85hDwaO0iLsn9btObQvDo/lvdv8PFKrL09MQM3mFBc5XU/rdUAFz
          ysW1dOSw6rFD5x0blX2EAKuzr9aQi6TjbFFXKWYitSkIngYFfJny/KttLhCBnUrX
          GokFf1A/vboI6WxO2a50FO3hu/Qpghuy+lWfuFa38Bgcb4GKsU45qstv+BYlOI4h
          9JwtIsNSMBPHdsq9fHxoRhYyte1gtNu7kmNEc5TK1J44HA3AH6KbCnkWDSwMTU1n
          Tz5FQcSLdqN51cn2KaIl1A2lvWBZvJSkV7w6OX6rsSPVAgMBAAE=
          -----END PUBLIC KEY-----
          FIN
          openssl rand -hex 32 > cle.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "NettoyagePC-Setup-$v.exe" -out chiffre/setup.chiffre -pass file:cle.txt
          openssl pkeyutl -encrypt -pubin -inkey publique.pem -pkeyopt rsa_padding_mode:oaep -in cle.txt -out chiffre/cle.chiffree
          rm -f cle.txt
          cp "NettoyagePC-Setup-$v.sha256" chiffre/
          echo "$v" > chiffre/version.txt
          echo "$GITHUB_SHA" > chiffre/commit.txt
          cd chiffre
          git init -q
          git checkout -q -b fabrication-5-chiffre
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Version $v de $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" fabrication-5-chiffre

      - name: Déjà publiée à la main ?
        id: existe
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          $oui = ($LASTEXITCODE -eq 0)
          if ($oui) { Write-Host "La version $env:GITHUB_REF_NAME est déjà publiée (à la main) : rien n'est republié." }
          "oui=$($oui.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Publication
        if: github.ref_type == 'tag' && steps.existe.outputs.oui != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Nettoyage PC ${{ steps.version.outputs.version }}${{ steps.version.outputs.beta == 'true' && ' (bêta)' || '' }}
          prerelease: ${{ steps.version.outputs.beta == 'true' }}
          body_path: NOTES-${{ steps.version.outputs.version }}.txt
          files: |
            NettoyagePC-Setup-${{ steps.version.outputs.version }}.exe
            NettoyagePC-Setup-${{ steps.version.outputs.version }}.sha256
            NettoyagePC-Setup.exe
